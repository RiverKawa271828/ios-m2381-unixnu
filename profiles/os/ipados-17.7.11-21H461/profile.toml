# text_fixups = <file>,<file offset>,<expected>,<replacement> (hex; applied by the kernel
# after signature validation, per patches/xnu text-fixup, reaching the kernel as
# /chosen/text-fixups). First four entries are the nx729j set for this donor build.
# 2026-10-26 addition: -[FBSDisplayMonitor _initWithBookendObserver:transformer:] entry
# returns at once (ARM64 `ret`). On boards without a kernel display service the function
# enumerates zero CA displays and its "no displays" assert (brk #0, text+0x47c) kills
# SpringBoard and contextstored at first launch (~1/s crash treadmill, r43/r44).
# 2026-10-26 addition 2 (r45): -[SpringBoard startupInterfaceOrientation] returns
# UIInterfaceOrientationPortrait (1) at once. The FBSDisplayMonitor fix let SpringBoard
# init proceed to UISystemShellApplication init, whose orientation query reaches
# BKSDisplayServicesGetRenderOverlayForDisplay -> NULL on a display-less kernel and
# asserts in BackBoardServices ("failure in %{public}@..." brk #0). Same wall, one
# frame deeper; portrait is the native orientation of the 2732-subtype panel class.
# 2026-10-27 addition 3 (r46): +[UIScreen mainScreen] skips its nil raise. With no
# display service the screen list is empty and UIKit 17 raises
# NSInternalInconsistencyException "returning nil screen from mainScreen is not
# allowed!" (uncaught -> SIGABRT; SpringBoard respawn loop ~18/17min; the BootFault
# reason-scan captured the string verbatim). The cbz into the raise helper
# (subcache .03 +0x3255e0c) branches to the clean return instead, so mainScreen
# returns nil and ObjC nil messaging zeroes the rects downstream. Same wall, UI layer.
# 2026-10-27 addition 4 (r47, two entries): the mainScreen fix let SpringBoard init run
# into -[SpringBoard _prepareBacklightServices], whose provider chain reaches
# +[SBMainDisplayRootWindowScenePresentationBinder sharedInstance] -> -_init ->
# initWithDisplayConfiguration: (mainConfiguration is empty with no displays) and
# raises NSInternalInconsistencyException "Invalid parameter not satisfying: display"
# (whole bt verified live: SpringBoard->SBBacklightServicesPlatformProvider->
# SBBacklightPlatformProvider->sharedInstance->dispatch_once). Both entries return at
# once: the whole backlight-domain prep (8a) and the binder init (8b, returns self so
# the later window-setup consumer of the shared instance cannot re-trigger the same
# assert). Same displayless wall, backlight domain.
# 2026-10-27 addition 5 (r48): the 8a ret let SpringBoard init run on into the
# workspace transition machinery: -[SBWorkspaceTransitionRequest
# _initWithWorkspace:displayConfiguration:] asserts both params (SBWorkspace
# TransitionRequest.m lines 47/48, NSAssertionHandler "Invalid parameter not

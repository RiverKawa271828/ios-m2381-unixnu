# Board description of the Meizu 20 Classic (m2381, SM8550) — BRING-UP lane,
# schema v2 (2026-10-26 migration, upstream 16e592a).
#
# This is the first-console board the CI device branch rides (the nx729j
# pattern: scripts/make-device-branch.sh device-m2381-bringup
# board.bringup.toml). The owner board.toml is the qualified end state; this
# one links only what a fresh runner can build from committed inputs.
#
# Layering and provenance comments live in board.toml; this file differs in
# the kernel switches (m2381_bringup_defconfig), the archive plan below and
# the first-light payload policy.

schema_version = 2

[board]
name = "m2381"
soc = "SM8550"
description = "Meizu 20 Classic"
kit = "sheng"
soc_source = "sm8550"
os_profile = "ipados-17.7.11-21H461"

# Same measured geometry as the owner board ([DEVICE] 2026-10-23, nura OS).
[userdata]
first_lba = 0x238f68              # 2330472, 4 KiB sectors  [DEVICE]
last_lba = 0x7621ffa              # 123871226               [DEVICE]
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

# Bring-up selection: no Adreno, no display archive — every switch in
# m2381_bringup_defconfig links an archive this plan can build.
[components]
include = [
  "ArmDTPlatform",
  "ArmCpu",
  "SoftwareAES",
  "ShengUfs",
  "VirtioMmioBlock",
  "RamBlock",
  "XnuPrelink",
  "DarwinBoot",
  "VerifiedRoot",
]

[kernel]
defconfig = "m2381_bringup_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# Archive builders of the kernel step, in order (nx729j static-binding lane:
# no audit-storage-interface.py, no per-driver bindings — the storage ABI
# comes from build-storage-bindings.py + prelink-storage-bindings.json).
archives = [
  # Restage the tree-pruned evidence (original kernelcache, prelink candidate
  # pairs) before any audit archive runs; see the script header.
  "stage-local-candidates.py",
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  # Publishes the ApplePMGRNub the donor AMFI's ConfigurationSettings waits on
  # (30 s timeout, then panic "AMFI: No PMGR?" @ConfigurationSettings.cpp:235
  # — first observed on hardware 2026-10-25). Board-side ShengPlatformPower,
  # same file fuxi links; mode 2 = publish the original nub via sheng-pmgr=2.
  "build-sheng-platform-power.py",
  # Storage stage (2026-10-25 round 17): the kernel reached "Failed to mount
  # root device @IOKitBSDInit.cpp:984" — bring up the NativeUfs root path,
  # mirroring the nx729j_storage_defconfig flag set. Static binding path:
  # upstream's audit-storage-interface.py needs a live-device lldb snapshot
  # (gdb-stop.json) we cannot produce; nx729j binds the same 190 slots from
  # the pre-measured prelink-storage-bindings.json instead.
  "build-storage-bindings.py",
  "component:ShengUfs",
  # Refusing placeholders merged into libNativeUfs.a (policy count 0) —
  # skipped automatically when the real evidence is staged below.
  "build-verified-root-stub.py",
  # Real VerifiedRoot probe archive when the macOS-produced OS policy is
  # staged in .cache/firmware (local owner lane); skipped on hosts without
  # evidence (CI), which stay on the stub and keep the flag off.
  "build-verified-root-if-evidenced.py",
  "component:VirtioMmioBlock",
  "component:RamBlock",
  # NativeUfs's weak boot_progress_poll reference still errors on this ld64;
  # no-op stub until the real BootProgress stage.
  "build-boot-progress-stub.py",
  "build-libpthread-kernel.py",
]
# [kernel.prelink] inherits from the OS profile (kits/XnuPrelink/emit_prelink.py,
# the 21H461 cache sha, slide -0x1000000, AMFI 0xfffffff005ab4ae0).

[device_tree]
source = "device:dts/m2381.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "m2381"                   # Resources/Configs/m2381.toml in the Mu-Silicium checkout (--uefi)
dsc = "Platforms/Meizu/m2381Pkg/m2381.dsc"
fd = "Build/m2381Pkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-m2381.py"]
submodules = ["Binaries", "Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Meizu",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "m2381"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "m2381-research"

[payload]
volume = "M2381ESP"
size_mib = 96
loader = "firmware"
title = "m2381 first boot: source 4K XNU to console"
dram_size = "0x400000000"            # [DEVICE] 16 GiB LPDDR5X
skip_setup_tool = "scripts/seed-data-skip-setup.py"   # used by --skip-setup
panic_screen = false
# panic_screen stays off for first light: the panic renderer patches the
# kernel by absolute virtual address measured on sheng's kernel, and this
# board's _panic address is unknown until a kernel exists (same refusal nx729j
# recorded in its bring-up board).
trust_cache_sha256 = [
  "4563bdbf6ed8f72237d45dbba3ccde432634338f95c10d79d5d4631678a97c7c",   # StaticTrustCache (044-76040-038.dmg.trustcache)
  "9742f3d566369e6c48f63b3dc0740b06c243d13c6650e25bbf44616e13d6d097",   # Cryptex1,SystemTrustCache (044-76034-038.dmg.trustcache)
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",   # original-trust.bundle (reproduces the fuxi pin independently)
]
# First light keeps the command line to what this kernel actually links,
# mirroring the nx729j bring-up discipline: every sheng-*/offline-* argument
# selects a code path inside an archive this defconfig does not build, and
# payload.py refuses the volume when an argument arrives without its
# implementation. Re-add them one at a time with the archive that implements
# them as the stages progress.
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "-no_slto_panic",
  # Board-side ApplePMGRNub publication; without it the donor AMFI panics
  # "No PMGR?" after its 30 s waitForMatchingService timeout.
  "sheng-pmgr=2",
  # Round 21+: mount the root volume through the board's UFS. Rounds 18-20
  # proved the whole transport (SMMU takeover, controller, DMA, GPT); the real
  # VerifiedRoot single-policy bundle (OS volume 04769D26) replaced the
  # refusing stub, so NativeUfs now publishes the block device. The probe=10
  # read-only check stays in the history as the transport gate.
  "native-ufs-root=1",
]
# text_fixups inherit from the OS profile (same donor build).

[payload.adt]
chip_id = "207"                     # [DTB] qcom,msm-id 0x207 (SM8550-AB) — same value sheng/nx729j use
owned_memory_size = "0x130000000"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"   # the 21H461 OS image Data volume UUID (same value fuxi/nx729j pin for this build)
packed_data_ramdisk = true
unique_chip_id = "required"          # the platform seed is not stored in any repository

# No [bootimg] table: the boot image carries no appended DTB at all
# (nura-proven on this ABL: BootShim header + gzip kernel member only; the
# stock vendor_boot DTB supplies the splash region and passes BoardDtMatch).

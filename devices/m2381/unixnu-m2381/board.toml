# Board description of the Meizu 20 Classic (m2381, SM8550), read by the
# unixnu build driver.
#
# Value provenance, following the nx729j discipline:
#   [DTB]    read from docs/hardware/stock-fdt.dts (the DT the stock ABL hands
#            to the payload on this phone; decompiled from the live device)
#   [DEVICE] measured on the phone (date + method in the comment)
#   [FW]     derived from the stock firmware package / ABL reverse engineering
#   [TODO]   not derivable yet; preflight must fail while these are open
#
# ABL constraints that shape this file (nura/docs/BOOT-CHAIN-RE.md §5, static
# RE of this phone's LinuxLoader, plus 2026-10-22/23 live evidence):
#   * the ABL gunzip window is [0x80080000, 0x85580000) ≈ 85 MiB total for
#     kernel + ramdisk + DT gap. A fuxi-style 192 MiB ramdisk payload makes
#     RdLoad go negative and trips the "Not Enough space" check — the payload
#     CANNOT ride in the boot image ramdisk on this phone, unlike sheng/fuxi.
#     Hence loader = firmware and the payload volume lives on the recovery_a
#     ESP (the negroni precedent), read through the UEFI UFS driver.
#   * boot header v4 (Flyme stock shape), kernel member gzipped, no appended
#     DTB (the stock vendor_boot DTB is used and passes BoardDtMatch).

[board]
name = "m2381"
soc = "SM8550"
description = "Meizu 20 Classic"
kit = "m2381"                      # package/ of this repository appears as kits/m2381 in the build tree

# The target OS image: the unchanged iPhone11,2 (iPhone XS) iOS 17.7 restore
# image. User decision 2026-10-24 (replacing the 2026-10-23 iPhone10,3/20H392
# choice): the UniXNU kernel source is xnu-10063.141.1 (iOS 17.6 generation),
# so the 20H392 donor was a cross-generation pairing all along — that mismatch
# produced both the entropy wall (16-gen corecrypto installs the PRNG before
# register_crypto_functions) and the AppleImage4 mix-n-match wall on device.
# 21H16 is the same 21H train the upstream boards (fuxi/nx729j on 21H461) pair
# natively with their xnu-10063 source, on a phone identity (d321ap) instead of
# a tablet. Apple no longer signs 21H16, which is irrelevant here: nothing in
# this flow asks Apple to countersign a restore.
# chip_id/board_id read from the local IPSW BuildManifest (d321ap Erase
# identity): ApChipID 0x8020 (t8020), ApBoardID 0x0e.
[ipsw]
url = "https://updates.cdn-apple.com/2024FallFCS/fullrestores/062-79002/2CDE0E28-284D-4554-A20B-DAFB4703AF3F/iPhone11,2,iPhone11,4,iPhone11,6_17.7_21H16_Restore.ipsw"
product = "iPhone11,2"
version = "17.7"
build = "21H16"
device_class = "d321ap"
chip_id = 0x8020
board_id = 14
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
# Whole-file sha256 of the two disk-image members inside the IPSW, computed
# from the local copy (sha256 of the full restore zip itself is
# 6fd757bed0d54ea97c60df7492024a778db28077ccab40b59861343c1b2cb722, also
# confirmed by the ipsw.me record for this build).
"044-17947-018.dmg" = "9b69f645e5673b9ce14ffed6211e33f13483b080781c5865739f3676db649c0e"   # OS
"044-17442-018.dmg" = "3b21f08ab8c9f21c5296e5a85f62054126ea9e604f3fe141c4d117c0ce127a58"   # Cryptex1,SystemOS

# The raw image for the userdata partition: the OS and SystemOS disk images of
# the IPSW behind a manifest.
#
# [DEVICE] 2026-10-23, measured twice via the nura OS (USB net, devsh):
#   * sysfs: sda22 start 18,643,776 / size 972,326,040 sectors at 512 B;
#   * the numbers below are those converted to 4096 B LBAs (LUN 0 logical
#     block size is 4096, read from /sys/class/block/sda/queue — same trap
#     as nx729j), consistent with the on-device GPT.
# [FW] cross-check against the stock fastboot package (gpt_main0.bin /
# rawprogram0.xml) is still open — see scripts/collect-m2381.py.
[userdata]
first_lba = 0x238f68              # 2330472, 4 KiB sectors  [DEVICE]
last_lba = 0x7621ffa              # 123871226               [DEVICE]
lba_bytes = 4096
# Bring-up order follows nx729j: mount the root "OS" window first; the
# "SystemOS" cryptex window is added back at the userland stage (stage 7).
windows = [
  { name = "OS", component = "OS" },
]

[kernel]
defconfig = "m2381_defconfig"
# The archive builders come from the fuxi kit (this repository is forked from
# reference/unixnu-fuxi). The SM8550 platform code (GIC, timer, PMGR, UFS,
# DPU, GMU) is SoC level and is reused unchanged; the sheng- prefixed kernel
# arguments below are read by those sheng kit sources and are not device
# names. Identity/panel/touch inputs are the device-specific parts.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  "audit-storage-interface.py",
  "build-arm-driver.py NativeUfs",
  "build-arm-driver.py NativeVirtioBlock",
  "build-arm-driver.py NativeRamBlock",
  "build-native-virtio-bindings.py --component NativeRamBlock --directory build/native-ram-block",
  "build-native-virtio-bindings.py --component NativeVirtioBlock",
  "build-mockfs-fixture.py",
  "build-sheng-platform-power.py",
  "build-boot-progress.py",
  "build-libpthread-kernel.py",
  "build-arm-driver.py NativeAdreno",
  "build-native-adreno-kits.py",
  "build-native-legacy-display.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
# sha256 of the decompressed 21H16 arm64 kernelcache, computed on Linux from
# the local IPSW (research/bin/ipsw kernel dec, 2026-10-24). The 20H392 value
# 2ec297ba… belonged to the retired iPhone10,3 pairing; the fuxi/nx729j value
# f18b4df8… is the 21H461 iPadOS kernelcache and does not apply either.
kernelcache_sha256 = "0fb5cf5915feeaa792e80af4d4a0ba2effdba658b41a68dbf0c2fd905d1f59f0"
# AMFI early initializer for the 21H16 kernelcache, derived on Linux
# (2026-10-24) by the three-build fingerprint method: the function prologue
# (ff0304d1 f85f0ca9 f6570da9 f44f0ea9 fd7b0fa9 fdc30391) is identical across
# 21H461/20H392/21H16 and unique inside each build's AMFI __TEXT_EXEC. On
# 21H461 the sole hit reproduces the fuxi value 0xfffffff005ab4ae0
# (TEXT_EXEC 0xfffffff005aaa000 + 0xaae0); on 20H392 the sole hit reproduces
# the device-proven 0xfffffff0056fc3f8 (+0x13f8). 21H16: AMFI __TEXT_EXEC
# 0xfffffff008f2ea10, sole hit +0xd308. slide follows the upstream build
# convention (-0x1000000, image-generation independent); the prelink pointer
# binding check adjudicates it.
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff008f3bd18"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

# The UEFI firmware package for this phone is built on the shengPkg skeleton
# (UniXNU/uefi-sheng shape) with the proven platform constants of the nura
# Mu chain: FD at 0xA7100000+0x300000, BootShim with kernel header + Gunyah
# watchdog disable, boot header v4, gzip, no appended DTB. See
# docs/STATE.md §5-A3 for the base decision record. The uefi checkout is a
# uefi-sheng clone with Platforms/Meizu/m2381Pkg and Resources/Configs/
# m2381.toml overlaid from devices/m2381/uefi/.
[firmware]
config = "m2381"                   # Resources/Configs/m2381.toml in the Mu-Silicium checkout (--uefi)
dsc = "Platforms/Meizu/m2381Pkg/m2381.dsc"
fd = "Build/m2381Pkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-m2381.py"]
submodules = ["Binaries", "Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Meizu",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "m2381"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "m2381-research"

# The payload volume: a FAT image with the UniXNU config, the kernel, the ADT
# and the optional trust cache and Data seed, written to the recovery_a
# partition (100 MiB; the volume must stay ≤ 96 MiB to fit with FAT slack).
# DarwinBoot (in the firmware volume) reads it through the UFS driver.
[payload]
volume = "M2381ESP"
size_mib = 96
loader = "firmware"
title = "m2381 first boot: source 4K XNU to console"
dram_size = "0x400000000"            # [DEVICE] 16 GiB LPDDR5X
skip_setup_tool = "scripts/seed-data-skip-setup.py"   # used by --skip-setup
panic_screen = true
# sha256 of the two trust caches inside the local 21H16 IPSW (2026-10-24).
trust_cache_sha256 = [
  "090c6a97ecfee493b4828733a37f505ebf51a890370204a6a948019ffff01cc7",   # StaticTrustCache (044-17947-018.dmg.trustcache)
  "8e43fc06870a087ddd7bda2d65f7439b8025195cf26c1ebb5cb3c9fb32f0da43",   # Cryptex1,SystemTrustCache (044-17442-018.dmg.trustcache)
  # The flat two-module bundle made by scripts/make-m2381-trust-bundle.py from the two above
  # (DarwinBoot/kernel need the bare container, not the IM4P files; modules unchanged).
  "e9f6c5b9e17849d3a4c33c5da4ed7d5008491f1cf30e44073f8d5978b3928b19",   # original-trust.bundle
]
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-unit-scale=2",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-hid-home=1",
  "offline-hid-input=1",
  "offline-legacy-phase=4",
  "offline-mobile-graphics-client=1",
  "offline-mobile-graphics-load=1",
  "offline-apfs-load=1",
  "boot-progress=1",                 # diagnostics page during bring-up; bump to 2 at stage 7
  "-apfs_shared_datavolume",
  "offline-key-events=1",
  "native-ufs-root=1",
  "sheng-pmgr=2",
  "armcpu-diagnostics=1",
  "sheng-disable-watchdogd=1",
  "sheng-disable-jobs=com.apple.identityservicesd,com.apple.locationd,com.apple.CommCenter,com.apple.bluetoothd",
  "boot-ui-focus3=Preferences",
  "boot-ui-focus4=SpringBoard",
  "sheng-smp=1",
  "sheng-cpufreq=3",
  "sheng-touch=4",
  "sheng-aks=1",
  "sheng-gpu-power=9",
  "sheng-gpu-metal=1",
  "sheng-fb-gpu=1",
  "sheng-banner=0",
  "sheng-gpu-perf=8",
  "sheng-gpu-addon=1",
  "armcpu-spi-ipi=1",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  "sheng-touch-hid=1",
  "sheng-data-persist=2",
]

# text_fixups for the shared caches: none carried yet. The nx729j 21H461
# fixups do NOT apply to the 21H16 caches this board boots; [TODO] derive the
# iPhone11,2/iOS 17.7 fixups at the userland stage (P4).

[payload.adt]
tool = "scripts/make-m2381-adt.py"
chip_id = "207"                     # [DTB] qcom,msm-id 0x207 (SM8550-AB) — same value sheng/nx729j use
owned_memory_size = "0x130000000"
# [TODO P3] root_match_volume_uuid of OUR userdata image (built from 21H16).
# The fuxi/nx729j value 04769D26-… belongs to the 21H461 iPadOS image and must
# not be copied; derive both this and CONFIG_XNU_OWNER_DATA_VOLUME_UUID from
# the built userdata image.
root_match_volume_uuid = "TODO-P3"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"   # [DTB] /cpus reg 0x00..0x700, 8 CPUs
packed_data_ramdisk = true
unique_chip_id = "required"          # the platform seed is not stored in any repository

# No [[bootimg.dtb_node]] here, unlike sheng.
#
# [FW] The boot image carries no appended DTB at all (nura-proven on this
# ABL: BootShim header + gzip kernel member only; the stock vendor_boot DTB
# supplies the splash region and passes BoardDtMatch). Nothing to patch.
